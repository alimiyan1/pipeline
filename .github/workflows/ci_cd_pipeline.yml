
        
name: Python Django CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Login to DockerHub
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build . -t your-dockerhub-username/your-image-name:$GITHUB_SHA
          docker push your-dockerhub-username/your-image-name:$GITHUB_SHA

      - name: Set up kubectl
        uses: azure/k8s-set-context@v1.0.0
        with:
          kubeconfig-data: ${{ secrets.KUBE_CONFIG_DATA }}

      - name : Deploy to GKE 
         run : | 
           kubectl apply -f deployment. 


        