
        
name: Python Flask CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  build-and-deploy-docker-image:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to DockerHub
        run: |
          docker build . -t your-dockerhub-username/flask-app:$GITHUB_RUN_NUMBER
          docker push your-dockerhub-username/flask-app:$GITHUB_RUN_NUMBER

  deploy-to-gke:
    needs: build-and-deploy-docker-image
    runs-on: ubuntu-latest

    steps:
      - name : Set up GKE cluster credentials 
         uses : google-github-actions/setup-gcloud@master 
         with :
           project_id : my-project-id 
           service_account_key : ${{ secrets.GCP_SA_KEY }}
           export_default_credentials : true 

       # Additional steps to deploy the Docker image to the Kubernetes cluster on GKE would go here.


        